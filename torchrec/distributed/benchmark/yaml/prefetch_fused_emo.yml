# A/B partner for prefetch_emo.yml: identical model, tables, planner constraints
# and run options, with only the pipeline swapped to "prefetch-fused".
#
# PrefetchTrainPipelineFusedSparseDist hoists the embedding lookup out of the
# traced forward and issues it before batch i+1's wait_sparse_data_dist, so
# batch i's embedding output all2all (which the forward blocks on immediately)
# enters the NCCL queue ahead of the input-dist all2all that has a full
# iteration of slack. Diff the two traces to see whether the batch-i output
# a2a is actually less exposed.
RunOptions:
  world_size: 2
  num_batches: 20
  num_benchmarks: 5
  num_profiles: 1
  sharding_type: table_wise
  profile_dir: "."
  name: "prefetch_fused_emo"
  memory_snapshot: True
  loglevel: "INFO"
  sync_batch: True
  # export_stacks: True # enable this to export stack traces
PipelineConfig:
  pipeline: "prefetch-fused"  # "prefetch" for the baseline
ModelInputConfig:
  num_float_features: 100
  feature_pooling_avg: 30
ModelSelectionConfig:
  model_name: "test_sparse_nn"
  model_config:
    num_float_features: 100
    submodule_kwargs:
      dense_arch_out_size: 128
      over_arch_out_size: 1024
      over_arch_hidden_layers: 5
      dense_arch_hidden_sizes: [128, 128, 128]
      skip_regroup: true
EmbeddingTablesConfig:
  num_unweighted_features: 30
  num_weighted_features: 40
  embedding_feature_dim: 256
  additional_tables:
    - - name: FP16_table
        embedding_dim: 512
        num_embeddings: 100_000
        feature_names: ["additional_0_0"]
        data_type: FP16
      - name: large_table
        embedding_dim: 512
        num_embeddings: 10_000_000
        feature_names: ["additional_0_1"]
    - []
    - - name: skipped_table
        embedding_dim: 128
        num_embeddings: 100_000
        feature_names: ["additional_2_1"]
PlannerConfig:
  pooling_factors: [30.0]  # Default pooling factor (no ModelInputConfig.feature_pooling_avg specified)
  additional_constraints:
    large_table:
      compute_kernels: [fused_uvm_caching]
      sharding_types: [row_wise]
      cache_params:
        load_factor: 0.2
        prefetch_pipeline: True
